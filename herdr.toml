onboarding = false

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[keys]
prefix = "ctrl+b"
last_pane = "prefix+;"

[[keys.command]]
key = "prefix+shift+m"
type = "shell"
command = '"$HERDR_BIN_PATH" pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'
description = "Mover panel a una tab nueva"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = '~/.config/herdr/tab-to-workspace.sh'
description = "Mover tab a workspace nuevo"
