set-window-option -g window-status-current-style bg=cyan
setw -g mode-keys vi
# --- UTF-8-safe clipboard (fixes â/mojibake on every copy path) ---
# tmux runs copy-pipe in the server's env, which may lack LANG, so pbcopy
# mis-decodes UTF-8 box-drawing bytes. Force the locale on each binding.
bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel "LC_CTYPE=UTF-8 pbcopy"
bind-key -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel "LC_CTYPE=UTF-8 pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "LC_CTYPE=UTF-8 pbcopy"
bind-key -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "LC_CTYPE=UTF-8 pbcopy"
bind-key -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "LC_CTYPE=UTF-8 pbcopy"
set -g mouse on
set -g focus-events on

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

bind-key C run-shell "~/coding/dotfiles/tmux-center.sh 100"
